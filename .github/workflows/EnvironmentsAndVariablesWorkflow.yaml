name: Environments and Variable workflow 
run-name: 'Running workflow for: ${{github.workflow}}'

on:
  push:
    branches:
      - github_actions
      # - 'feature-*'
  pull_request:
    branches:
      - main # when PR raised to merge in main branch
  workflow_dispatch:

# Adding Global level Env variables for workflow
env:
  ENV_TYPE: Dev
  APP_USER: Pankaj
  APP_PORT: 5000
jobs:
  job1:
    name: Evironments, Variables & contexts set by github job1 UI name
    runs-on: ubuntu-latest
    steps:
      - name: Default env variables by github
        run: |
          echo "[INFO] The workspace for current workflow is $GITHUB_WORKSPACE."
      - name: Built-in contexts by github
        run: |
          echo "[INFO] The Built-in contexts for workspace is ${{github.workspace}}."
          echo  "[INFO] The Built-in contexts for repository is ${{ github.repository }}."
          echo  "[INFO] The Built-in contexts for actor is ${{ github.actor }}."
          

  job2:
    name: Workflow Level Evironment Variables and Repo Secrets job2 UI name
    runs-on: ubuntu-latest
    steps:
      - name: Referring Workflow level Env variables
        run: |
          echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER."
          echo "[INFO] Application is Accessible on port $APP_PORT."    
      - name: Referring to  Repo Secrets
        run: |
          echo "[INFO] Application password is ${{secrets.APP_PASSWORD}}"
          
  job3:
    name: Build-in contexts job3 UI name
    runs-on: ubuntu-latest
    steps:
      - name: Referring to Build-in contexts 
        run: |
          echo "[INFO] The current job ID is ${{ job.check_run_id }}."
          echo "[INFO] The architecture of the runner ${{ runner.arch }}."
          echo "[INFO] The runner is ${{ runner.environment }}."
          echo "[INFO] The branch is ${{ github.ref }}."
          echo "[INFO] The branch name is ${{ github.github.ref_name }}."
  
  Development:
    name: Build For Development Env. 
    runs-on: ubuntu-latest
    environment:
      name: DEVELOPMENT
    steps:
      - name: Referring Development Env specific Env Vars
        run: |
          echo "[INFO] The user is ${{ vars.USER_NAME }}."
          echo "[INFO] The host is ${{ vars.HOST }}."
          echo "[INFO] The password is ${{ secrets.PASSWORD }}."
          
  Productoin:
    name: Build For production Env. 
    runs-on: ubuntu-latest
    environment:
      name: PRODUCTION
    steps:
      - name: Referring production Env specific Env Vars
        run: |
          echo "[INFO] The user is ${{ vars.USER_NAME }}."
          echo "[INFO] The host is ${{ vars.HOST }}."
          echo "[INFO] The password is ${{ secrets.PASSWORD }}."
      
  
          