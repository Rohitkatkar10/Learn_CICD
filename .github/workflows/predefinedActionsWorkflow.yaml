name: Predefined-gitHub-Actions

on:
  push:
  
jobs:
  job1:
    name: predefined upload artifacts action job1 UI name 
    runs-on: ubuntu-latest
    steps:
      - name: List of directories before checkout 
        run: |
          pwd
          ls -ltr
          hostname
          
      - name: check current workspace and repository
        run: |
          echo $GITHUB_WORKSPACE
          echo ${{github.workspace}}
          echo  ${{ github.repository }}
          echo  ${{ github.actor }}
          
      - name: checkout git repo
        uses: actions/checkout@v6
        # with: # with key will allow user to add more details about repo and branch name 
          # repository: <name of the other repository> # 
          # ref: <name of the branch >  # name of the branch from 'repository' else default repo is same repo where workflow run
          
      - name: List of directories after checkout
        run: |
          echo `pwd` >> myartifact.txt 
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt 
          echo `hostname` >> artifacts/hostname.txt 
          
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: single_file
          path: ./myartifact.txt
          retention-days: 1 # Avoid storage occupation since upload it done for learning
          
      - name: upload from directory 
        uses: actions/upload-artifact@v7
        with: 
          name: directory_artifacts
          path: artifacts/
          
      - name: upload from multiple paths 
        uses: actions/upload-artifact@v7
        with:
          name: multiple_directory_artifacts
          path: |
            ./myartifact.txt
            artifacts/
          retention-days: 1
            
      - name: upload from multiple path with exclusion 
        uses: actions/upload-artifact@v7
        with:
          name: multiple_path_with_exclusion # ! will exclude.
          path: |
            ./myartifact.txt 
            artifacts/
            !**/hostname.txt
          retention-days: 1
  job2:
    name: predefined download artifacts action job2 UI name
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: List of directories before download
        run: |
          pwd
          ls -ltr
      - name: Download single file artifacts 
        uses: actions/download-artifact@v8
        with:
          name: single_file
      - name: List of directories after download
        run: |
          pwd
          ls -ltr 
          
  job3:
    name: predefined download artifacts from directories job3 UI name
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: List of directories before download
        run: |
          pwd
          ls -ltr
      - name: Download directories file artifacts 
        uses: actions/download-artifact@v8
        with:
          name: directory_artifacts
      - name: List of directories after download
        run: |
          pwd
          ls -ltr 
          
          
  job4:
    name: predefined download artifacts from multiple directories job4 UI name
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Creating directories
        run: |
          mkdir -p single_file_dir
          mkdir -p multiple_file_dir
          
      - name: Download single file artifacts 
        uses: actions/download-artifact@v8
        with:
          name: single_file
          path: single_file_dir
          
      - name: List of directories before download
        run: |
          pwd
          ls -ltr
          
      - name: Download directories file artifacts 
        uses: actions/download-artifact@v8
        with:
          name: directory_artifacts
          path: multiple_file_dir
  
      - name: List of directories after download
        run: |
          pwd
          echo "checking in single_file_dir"
          ls -ltr single_file_dir
          echo "checking in multiple_file_dir"
          ls -ltr multiple_file_dir
          