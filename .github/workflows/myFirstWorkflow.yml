name: my-first-workflow # Name of the workflow shown on the left side in `Actions` tab.
# run-name: This-is-name # `Dynamic name`, shown for ran workflows in middle, `optinal`, else commit message shown

# Trigger this workflow for every push for all branches
on: push 
jobs:
  job1: # This should be unique
    name: job1 UI name # Optional, descriptive, 
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in job1
        run: echo "Hi, this is my first command run"
      - name: Check OS release of the runner
        run: cat /etc/os-release
  job2:
    name: job2 UI name 
    runs-on: ubuntu-latest
    steps: 
      - name: checking hostname for runner
        run: hostname
      - name: Running multiple commands 
        run: |
          echo "Hi, From second job and second step"
          echo "The second command from multiple commands section"
          echo "Current time is `date`"
  job3:
    name: job3 UI name
    runs-on: windows-latest
    needs: job1
    steps:
      - name: Running single command in Job3 
        run: echo "Hi, I am from Job3"
      - name: Running Powershell (win) command to get computer info
        shell: pwsh
        run: get-computerinfo
  job4:
    name: job4 UI name 
    runs-on: macos-latest
    needs: [job1, job2, job3]
    steps:
      - name: Running single command in job4 
        run: echo "Hi, I'm from Job4"
      - name: Running macos command to get computer info
        run: sw_vers
    
        
    
